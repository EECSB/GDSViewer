# Publishes the two packages, on a v* tag.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag decides the version. Directory.Build.props carries the same number so a local `dotnet pack`
# produces what the release would, and the two are checked against each other below rather than trusted:
# tagging v0.2.0 without bumping the file is the mistake this exists to catch, and it is one that would
# otherwise publish a package whose version nobody chose.
#
# Authenticated by Trusted Publishing, so no API key is stored anywhere. GitHub issues a short-lived signed
# OIDC token describing this repository and this workflow file; nuget.org checks it against a policy
# registered there and hands back a key that lives one hour. Nothing to rotate, nothing to leak.
#
# ─── One-time setup on nuget.org ─────────────────────────────────────────────────────────────────────
#   Sign in → your username → Trusted Publishing → add a policy:
#       Package Owner    : EECSB
#       Repository Owner : EECSB
#       Repository       : GDSViewer
#       Workflow File    : publish-nuget.yml    (file name only, no path)
#       Environment      : (leave empty - this workflow declares none)
#       Scopes           : Push → "Push new packages and package versions"
#       Glob             : GdsII*               (both ids; neither package exists yet, so a pattern is
#                                                required rather than an existing package to attach to)
#
# ─── One-time setup on GitHub ────────────────────────────────────────────────────────────────────────
#   NUGET_USER = the nuget.org username, the profile name rather than the sign-in email.
#
# **The policy is keyed to this file's name.** Renaming this file stops publishing working until the
# policy is edited to match, and the failure reads as a credentials problem rather than as a rename.
#
# The push is still the last step, because it is the one that cannot be undone: a version on nuget.org can
# be unlisted but never replaced.
name: Release

#
# Two ways in, as LabEquipmentController's publish-nuget.yml has:
#
#   git tag v1.0.0 && git push origin v1.0.0     the usual one, and the one that cuts a GitHub Release
#   Actions → Release → Run workflow             manual, for a re-run after a push that half failed
#
# A tag decides its own version and is checked against Directory.Build.props below. A manual run has no tag
# to read, so it publishes whatever version the file already carries - there is nothing to disagree with.
on:
  push:
    tags: ['v*']

  workflow_dispatch:

# `contents` for the GitHub Release at the end; `id-token` is what lets the job ask GitHub for the OIDC
# token that the NuGet login below trades for a key.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Pack and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # GDSViewer.csproj sets RunAOTCompilation, and that is a workload requirement the moment the project
      # is evaluated rather than only when it is published - so `dotnet restore` fails here with NETSDK1147
      # and every step after it is a step that never ran. It reads as a test failure in the summary and is
      # nothing of the kind: the build never happened.
      #
      # The same line is in that csproj's own comment, for somebody setting a machine up to publish by
      # hand. Both places say it so neither can quietly stop being true.
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      #
      # The version, from the tag when there is one and from the file when there is not.
      #
      # A tag is a claim about a number, so it gets checked: tagging v0.2.0 without bumping
      # Directory.Build.props is the mistake this exists to catch, and it would otherwise publish a version
      # nobody chose. A manual run makes no such claim - it publishes what the file says, so there is
      # nothing to disagree with and nothing to check.
      #
      - name: Work out the version
        id: version
        run: |
          declared=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tagged="${GITHUB_REF_NAME#v}"

            if [ "$declared" != "$tagged" ]; then
              echo "The tag says $tagged and Directory.Build.props says $declared."
              echo "Bump the file, or tag the version that is in it."
              exit 1
            fi

            echo "Both say $declared."
          else
            echo "No tag; publishing the version in Directory.Build.props: $declared."
          fi

          echo "number=$declared" >> "$GITHUB_OUTPUT"

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      # The same filter CI uses, and for the same reason - see ci.yml.
      - name: Test
        run: dotnet test --configuration Release --no-build --filter "Needs!=KLayout"

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output ./artifacts

      # As late as possible, immediately before the push: the key this hands back is good for one hour, and
      # each token buys exactly one of them.
      - name: NuGet login (OIDC, for a short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Last, because it is the only step here that cannot be taken back.
      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      #
      # The symbols package, pushed by name rather than left to be inferred.
      #
      # `*.nupkg` above does not match `GdsII.1.0.0.snupkg` - the glob wants a literal `.nupkg` on the end
      # and that file ends `.snupkg`. NuGet does usually push a sibling symbols package alongside its own,
      # but "usually" is the wrong thing to rest on for the file that decides whether a consumer's stack
      # trace stops at the assembly boundary. Tolerated if it fails: symbols are worth having and not worth
      # failing a release over, and the packages are already up by this point.
      #
      - name: Push symbols
        continue-on-error: true
        run: dotnet nuget push "./artifacts/*.snupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Kept whichever way this ran, so a manual publish still leaves the exact bytes that went up.
      - uses: actions/upload-artifact@v7
        with:
          name: published-nupkg
          path: ./artifacts/*.*nupkg
          if-no-files-found: error

      #
      # Only a tag gets a GitHub Release, because only a tag has something to hang one on.
      #
      # A manual run is for republishing a version whose push half failed; it has no ref to release against
      # and there is nothing to announce that the tag's own release did not already say.
      #
      - name: Release on GitHub
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
          body: |
            ## Install

            The library:

            ```
            dotnet add package GdsII --version ${{ steps.version.outputs.number }}
            ```

            The command-line tool:

            ```
            dotnet tool install -g GdsII.Cli --version ${{ steps.version.outputs.number }}
            ```

            Both are public domain — [The Unlicense](https://github.com/EECSB/GDSViewer/blob/master/UNLICENSE).
            The `.nupkg` files below are the same ones on nuget.org.
